<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de sesiones — QeroHealth</title>
    <link rel="icon" href="../../img/logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/index.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/historial.css">
</head>
<body class="app-body">

    <!-- HEADER SUPERIOR -->
    <header class="app-header">
        <div class="container app-header-inner">
            <a href="panel.html" class="logo-group">
                <div class="logo-icon">
                    <i class="fa-solid fa-handshake-angle"></i>
                </div>
                <span class="logo-title">QeroHealth</span>
            </a>

            <div class="app-header-right">
                <nav class="app-nav" aria-label="Navegación de especialista">
                    <a href="panel.html" class="app-nav-link">
                        <i class="fa-solid fa-house"></i>
                        <span>Panel</span>
                    </a>
                    <a href="paciente.html" class="app-nav-link active">
                        <i class="fa-solid fa-users"></i>
                        <span>Pacientes</span>
                    </a>
                    <a href="catalogo.html" class="app-nav-link">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <span>Rutinas</span>
                    </a>
                    <a href="seguimiento.html" class="app-nav-link">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Seguimiento</span>
                    </a>
                    <a href="../ayuda.html" class="app-nav-link">
                        <i class="fa-regular fa-circle-question"></i>
                        <span>Ayuda</span>
                    </a>
                </nav>

                <a href="../cuenta.html" class="app-nav-link app-nav-account" aria-label="Mi cuenta" title="Mi cuenta">
                    <i class="fa-regular fa-user"></i>
                </a>

                <button type="button" id="btn-open-logout" class="app-nav-link app-nav-exit" aria-label="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Salir</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="app-main">
        <div class="container fade-in">

            <!-- CABECERA -->
            <section class="hist-top-bar">
                <div class="hist-top-left">
                    <a href="paciente-detalle.html" id="btn-back-detail" class="back-btn" aria-label="Volver al detalle del paciente">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <div>
                        <h1 class="page-title">Historial de sesiones</h1>
                        <p id="hist-patient-sub" class="hist-patient-sub">Cargando paciente...</p>
                    </div>
                </div>

                <button type="button" id="btn-send-reminder" class="btn btn-primary btn-interactive">
                    <i class="fa-regular fa-bell"></i>
                    <span>Enviar recordatorio</span>
                </button>
            </section>

            <!-- MENSAJE DE CONFIRMACIÓN DE RECORDATORIO -->
            <div id="reminder-toast" class="reminder-toast hidden" role="status" aria-live="polite">
                <div class="reminder-toast-left">
                    <i class="fa-solid fa-circle-check"></i>
                    <span id="reminder-toast-text">Se envió el recordatorio exitosamente.</span>
                </div>
                <button type="button" id="btn-close-toast" class="reminder-toast-close" aria-label="Cerrar aviso">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- LISTA COMPLETA DE HISTORIAL -->
            <section class="hist-card">
                <div class="hist-card-head">
                    <h2 class="hist-card-title">Registro de rutinas</h2>
                    <span id="hist-total-badge" class="hist-total-badge">0 sesiones</span>
                </div>

                <div id="hist-list" class="hist-list">
                    <!-- Se llena desde historial.js -->
                </div>
            </section>

        </div>
    </main>

    <!-- OVERLAY: CERRAR SESIÓN -->
    <div id="logout-modal" class="modal-overlay hidden">
        <div class="modal-card fade-in">
            <div class="modal-icon-danger">
                <i class="fa-solid fa-right-from-bracket"></i>
            </div>
            <h2 class="modal-title">¿Cerrar sesión?</h2>
            <p class="modal-desc">¿Estás seguro de que quieres salir de tu cuenta?</p>
            <div class="modal-actions">
                <button type="button" id="btn-cancel-logout" class="btn btn-outline w-full justify-center btn-interactive">
                    Continuar
                </button>
                <button type="button" id="btn-confirm-logout" class="btn btn-danger w-full justify-center btn-interactive">
                    Cerrar sesión
                </button>
            </div>
        </div>
    </div>

    <script src="../../js/data.js"></script>
    <script src="../../js/historial.js"></script>
</body>
</html>
