<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi rutina — QeroHealth</title>
    <link rel="icon" href="../../img/logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/index.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/paciente-rutina.css">
</head>
<body class="app-body">

    <!-- HEADER SUPERIOR -->
    <header class="app-header">
        <div class="container app-header-inner">
            <a href="panel.html" class="logo-group">
                <div class="logo-icon">
                    <i class="fa-solid fa-handshake-angle"></i>
                </div>
                <span class="logo-title">QeroHealth</span>
            </a>

            <div class="app-header-right">
                <nav class="app-nav" aria-label="Navegación de paciente">
                    <a href="panel.html" class="app-nav-link">
                        <i class="fa-solid fa-house"></i>
                        <span>Inicio</span>
                    </a>
                    <a href="mi-rutina.html" class="app-nav-link active">
                        <i class="fa-solid fa-play"></i>
                        <span>Mi rutina</span>
                    </a>
                    <a href="avance.html" class="app-nav-link">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Avance</span>
                    </a>
                    <a href="recursos.html" class="app-nav-link">
                        <i class="fa-solid fa-book-open"></i>
                        <span>Guias</span>
                    </a>
                    <a href="../ayuda.html" class="app-nav-link">
                        <i class="fa-regular fa-circle-question"></i>
                        <span>Ayuda</span>
                    </a>
                </nav>

                <a href="../cuenta.html" class="app-nav-link app-nav-account" aria-label="Mi cuenta" title="Mi cuenta">
                    <i class="fa-regular fa-user"></i>
                </a>

                <button type="button" id="btn-open-logout" class="app-nav-link app-nav-exit" aria-label="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Salir</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="app-main">
        <div class="container fade-in">

            <!-- CABECERA -->
            <section class="pr-top-bar">
                <div class="pr-top-left">
                    <div>
                        <p class="pr-kicker">Plan semanal asignado</p>
                        <h1 id="pr-routine-title" class="page-title">Mi rutina</h1>
                        <p id="pr-patient-sub" class="pr-sub">Cargando rutina...</p>
                    </div>
                </div>

                <a href="ejecutar-ejercicio.html?index=0" id="btn-main-action" class="btn btn-primary btn-interactive pr-main-cta">
                    <i class="fa-solid fa-play"></i>
                    <span id="btn-main-action-text">Iniciar rutina</span>
                </a>
            </section>

            <!-- TARJETA RESUMEN DE PROGRESO -->
            <section id="pr-summary-card" class="pr-summary-card">
                <div class="pr-summary-top">
                    <div class="pr-summary-info">
                        <span id="pr-progress-label" class="pr-summary-label">Progreso de esta semana</span>
                        <strong id="pr-completed-text" class="pr-completed-text">0 de 0 ejercicios completados</strong>
                    </div>
                    <div class="pr-summary-badges">
                        <span id="pr-total-time" class="pr-meta-pill">
                            <i class="fa-regular fa-clock"></i> 0 min aprox.
                        </span>
                        <span id="pr-pct-badge" class="pr-pct-badge">0%</span>
                    </div>
                </div>

                <div class="pr-progress-track">
                    <div id="pr-progress-fill" class="pr-progress-fill" style="width: 0%;"></div>
                </div>
            </section>

            <!-- LISTA DE EJERCICIOS -->
            <section class="pr-list-section">
                <div class="pr-list-head">
                    <h2 class="pr-list-title">Ejercicios de tu rutina</h2>
                    <span id="pr-count-badge" class="pr-count-badge">0 ejercicios</span>
                </div>

                <div id="pr-exercises-list" class="pr-exercises-list">
                    <!-- Se llena desde paciente-rutina.js -->
                </div>
            </section>

        </div>
    </main>

    <!-- OVERLAY: CERRAR SESIÓN -->
    <div id="logout-modal" class="modal-overlay hidden">
        <div class="modal-card fade-in">
            <div class="modal-icon-danger">
                <i class="fa-solid fa-right-from-bracket"></i>
            </div>
            <h2 class="modal-title">¿Cerrar sesión?</h2>
            <p class="modal-desc">¿Estás seguro de que quieres salir de tu cuenta?</p>
            <div class="modal-actions">
                <button type="button" id="btn-cancel-logout" class="btn btn-outline w-full justify-center btn-interactive">
                    Continuar
                </button>
                <button type="button" id="btn-confirm-logout" class="btn btn-danger w-full justify-center btn-interactive">
                    Cerrar sesión
                </button>
            </div>
        </div>
    </div>

    <script src="../../js/data.js"></script>
    <script src="../../js/paciente-rutina.js"></script>
</body>
</html>
